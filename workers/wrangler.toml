name = "privacy-cash-relayer"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-16"

# Keep the D1 mirror fresh between relays: read routes no longer sync lazily.
[triggers]
crons = ["* * * * *"]

[build]
command = "worker-build --release"

[vars]
PROGRAM_ID = "CHvKW5fCPNfikvfHA1cxQL8guoyFGqRvwdr1B3NdNVss"
RELAYER_FEE_RATE_BPS = "25"
RELAYER_MIN_TRANSFER_FEE_LAMPORTS = "10000"
RELAYER_SKIP_PREFLIGHT = "false"
# Comma-separated list of supported SPL mints (fee ATAs are derived from the
# relayer fee recipient + mint).
SUPPORTED_MINTS = "HLb8KZXK6sQvPvFqcoGSyVsYB5mGfBGJa2gT9B6G1BkC"

# Secrets (set via `wrangler secret put`, never committed):
#   RELAYER_KEYPAIR_JSON  - JSON byte array of the relayer seed (solana keypair file contents)
#   SOLANA_RPC_URL        - JSON-RPC endpoint (devnet: https://api.devnet.solana.com)
#   ADMIN_PASSWORD        - operator password guarding the mutating admin routes

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "2760a35be1424098940518197679f7e3"
# The ledger mirror is read-after-write critical (insert tree row, then read
# it back); Hyperdrive's default query cache served stale snapshots.
caching = false
