[package]
name = "privacy-cash-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.6" }
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false }
curve25519-dalek = { version = "4", default-features = false }

# Merkle / field-arithmetic — must match the on-chain program exactly
# (same versions as backend/Cargo.toml).
light-hasher = "4.0.0"
ark-bn254 = "0.5"
ark-ff = "0.5"

[profile.release]
lto = true
strip = true
codegen-units = 1

# Standalone crate: deliberately not part of the root Cargo workspace.
[workspace]

# tokio-postgres' rand pull needs the js backend on wasm32-unknown-unknown.
[dependencies.getrandom]
version = "0.3"
features = ["wasm_js"]
