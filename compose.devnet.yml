services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: charon_devnet
      POSTGRES_USER: charon
      POSTGRES_PASSWORD: ${DEVNET_DB_PASSWORD:-charon-local-only}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - devnet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charon -d charon_devnet"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  devnet-postgres:
