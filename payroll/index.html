    <script>
      // light by default; dark only when the user picked it (no white flash).
      // ?theme=dark|light / ?role=employer|employee deep-links override and
      // persist — also how headless screenshots pin a state.
      try {
        var qs = new URLSearchParams(location.search)
        var qTheme = qs.get("theme")
        var qRole = qs.get("role")
        if (qTheme === "dark" || qTheme === "light") localStorage.setItem("privacy-cash-theme", qTheme)
        if (qRole === "employer" || qRole === "employee") localStorage.setItem("payroll:role", qRole)
        else if (qRole === "landing") localStorage.removeItem("payroll:role")
        if (qs.has("static")) document.documentElement.classList.add("static")
        if (localStorage.getItem("privacy-cash-theme") === "dark")
          document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
