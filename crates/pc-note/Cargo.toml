[package]
name = "pc-note"
version = "0.1.0"
edition = "2021"
description = "Note encryption for privacy-cash: self-encrypted UTXO payloads with a cheap view tag for scanning."

[dependencies]
pc-core = { workspace = true }
chacha20poly1305 = "0.10"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
hex = "0.4"
