[package]
name = "privacy-cash-prover"
version = "0.1.0"
edition = "2021"
description = "Hosted ark-groth16 prover for Privacy Cash (compressed A/B/C)"

[[bin]]
name = "privacy-cash-prover"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ark-bn254 = "0.6.0"
ark-circom = "0.6.0"
ark-ec = "0.6.0"
ark-ff = "0.6.0"
ark-groth16 = "0.6.0"
ark-serialize = "0.6.0"
ark-std = "0.6.0"
bs58 = "0.5"
hex = "0.4"
num-bigint = "0.4"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmer = "6.1.0"
wasmer-types = "6.1.0"
