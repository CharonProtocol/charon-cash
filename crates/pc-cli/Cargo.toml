[package]
name = "pc-cli"
version = "0.1.0"
edition = "2021"
description = "pcash — command-line wallet for privacy-cash: init a shielded key, deposit, scan, check balance, and withdraw."

[[bin]]
name = "pcash"
path = "src/main.rs"

[dependencies]
pc-core = { workspace = true }
pc-client = { workspace = true }
pc-note = { workspace = true }

clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bs58 = "0.5"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }

solana-rpc-client = "3.1"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-pubkey = "3"
solana-instruction = "3"
solana-message = "3.1"
solana-transaction = "3.1"
solana-commitment-config = "3.0"
solana-compute-budget-interface = "3"
solana-native-token = "3.0"
