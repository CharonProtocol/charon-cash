[package]
name = "pc-core"
version = "0.1.0"
edition = "2021"
description = "Client-side cryptography for privacy-cash: UTXOs, commitments, nullifiers, ext-data hashing, and the client Merkle mirror. Pure Rust port of the upstream TypeScript."

[dependencies]
pc-types = { workspace = true }
# Poseidon, bit-identical to circomlib and to the on-chain program (same crate).
light-hasher = "4.0.0"
# Field arithmetic on BN254 Fr; pinned to match light-hasher/the program (single ark-bn254 0.5.0).
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
num-bigint = "0.4"
# ext-data hash is SHA-256 (not keccak), over a hand-rolled borsh layout.
sha2 = "0.10"
# Blinding must be a uniform field element — no Math.random()-grade entropy.
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
hex = "0.4"
