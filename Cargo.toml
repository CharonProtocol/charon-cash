[workspace]
resolver = "2"
members = [
    "programs/privacy-cash",
    "backend",
]
# The prover crate is a standalone workspace (its own wasm/native builds);
# the program's host tests use it as a path dependency.
exclude = ["crates/privacy-cash-prover"]

[profile.dev]
# Important for wasmer + rust-probestack issues
opt-level = 1
lto = false
codegen-units = 1
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
