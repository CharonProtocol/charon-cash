[package]
name = "privacy-cash"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[profile.dev]
# Important for wasmer + rust-probestack issues
opt-level = 1
lto = false
codegen-units = 1
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
pinocchio = "0.10.2"
pinocchio-system = "0.5.0"
pinocchio-token = "0.5.0"
pinocchio-log = "0.5.1"
pinocchio-associated-token-account = "0.3.0"
pinocchio-pubkey = "0.3.0"
bytemuck = { version = "1.25.0", features = ["derive","min_const_generics"] }
num-derive = "0.4.2"
solana-clock = "3.0.1"
shank = "0.4.8"
light-hasher = "4.0.0"
solana-bn254 = "3.2.1"

[dev-dependencies]
# The on-chain program does its BN254 arithmetic on raw bytes (see
# `src/field.rs`); arkworks is only needed by the test prover and by the tests
# that check the byte arithmetic against it.
ark-bn254 = "0.6.0"
ark-ff = "0.6.0"
ark-serialize = "0.6.0"
num-bigint = "0.4"

litesvm = "0.10.0"
litesvm-token = "0.10.0"

solana-instruction = "3.1.0"
solana-keypair = "3.1.2"
solana-native-token = "3.0.0"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"
solana-message = "3.0.1"
solana-sdk-ids = "3.1.0"
solana-rpc-client = "3.1.9"

spl-token-2022 = { version = "11.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }
spl-associated-token-account-interface = "2.0.0"

five8 = "1.0.0"
five8_core = "1.0.0"
solana-address-lookup-table-program = "2.2.20"
solana-address-lookup-table-interface = "=3.1.0"
sha256 = "1.6.0"
ethers = "2.0.14"
rand = "0.10.2"
num-traits = "0.2.19"
solana-program = "4.0.0"
serde = "1.0.228"
serde_json = "1.0.150"
solana-sdk = "4.0.1"
borsh = "1.8.0"
sha2 = "0.11.0"
ark-circom = "0.6.0"
ark-std = "0.6.0"
once_cell = "1.21.4"
anyhow = "1.0.103"
ark-ec = "0.6.0"
ark-groth16 = "0.6.0"
ark-relations = "0.6.0"
wasmer = "6.1.0"
wasmer-types = "6.1.0"
solana-compute-budget-interface = "3.0.0"
solana-system-interface = "3.2.0"
solana-address = "2.6.1"
solana-program-pack = "3.1.0"
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
itertools = "0.15.0"
mollusk-svm = "0.14.0"
mollusk-svm-bencher = "0.14.0"
mollusk-svm-programs-token = "0.14.0"
