[workspace]
resolver = "2"
members = [
    "programs/privacy-cash",
]
# The QEDGen model crate and fuzz harness are standalone workspaces. `backend`
# has no lockfile and pulls sqlx/postgres, so it stays out of the `--locked`
# workspace CI builds.
exclude = ["verification", "backend"]

[profile.dev]
# Important for wasmer + rust-probestack issues
opt-level = 1
lto = false
codegen-units = 1
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
