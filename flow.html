<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Privacy Cash · action flows</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#ffffff;
    --panel:#f5f6f8;
    --panel-2:#eef0f4;
    --line:#e4e7ec;
    --line-2:#d4d8e0;
    --ink:#0e1116;
    --body:#3f4757;
    --mute:#868f9e;
    --accent:#5b54e6;
    --accent-soft:#ecebfc;
    /* role colors */
    --c-program:#111827;
    --c-indexer:#0e7c86;
    --c-wallet:#5b54e6;
    --c-sdk:#b45309;
    --c-data:#424a57;
    --c-chain:#6b7280;
    --c-operator:#7c3aed;
    --f-display:"Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-body:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --maxw:1140px;
    --radius:14px;
    --shadow:0 1px 2px rgba(16,20,28,.04), 0 10px 30px rgba(16,20,28,.06);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--f-body);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ---------- typography ---------- */
  .eyebrow{
    font-family:var(--f-mono); font-size:.74rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--mute);
    display:inline-flex; align-items:center; gap:.6em; margin:0 0 1rem;
  }
  .eyebrow::before{content:""; width:7px; height:7px; border-radius:2px; background:var(--accent)}
  .h1{font-family:var(--f-display); font-weight:700; line-height:1.02; letter-spacing:-.02em; margin:0}
  .h2{font-family:var(--f-display); font-weight:600; line-height:1.06; letter-spacing:-.015em; font-size:clamp(1.7rem,3.4vw,2.6rem); margin:0 0 .9rem}
  .lead{font-size:clamp(1rem,1.4vw,1.18rem); line-height:1.55; color:var(--body); margin:0; max-width:70ch}
  .mute{color:var(--mute)}
  .mono{font-family:var(--f-mono)}
  .accent{color:var(--accent)}

  /* ---------- layout ---------- */
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 clamp(20px,5vw,48px)}
  .grid-2{display:grid; grid-template-columns:1.15fr .85fr; gap:clamp(20px,3vw,40px); align-items:start}
  .col{display:flex; flex-direction:column; gap:.9rem}

  /* ---------- chrome ---------- */
  .topbar{position:sticky; top:0; z-index:30; background:rgba(255,255,255,.85); backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--line)}
  .topbar__inner{display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:14px 0}
  .brand{display:flex; align-items:center; gap:.6rem; font-family:var(--f-mono); font-size:.74rem; letter-spacing:.1em; text-transform:uppercase; color:var(--mute)}
  .brand b{color:var(--ink); font-weight:600; letter-spacing:.04em; text-transform:none; font-family:var(--f-display); font-size:.95rem}
  .topbar__meta{display:flex; align-items:center; gap:.7rem; font-family:var(--f-mono); font-size:.72rem; color:var(--mute)}
  .topbar__meta a{color:var(--accent); text-decoration:none}
  .topbar__meta a:hover{text-decoration:underline}

  /* ---------- flow switcher ---------- */
  .flowswitch{display:flex; flex-wrap:wrap; gap:6px; padding:16px 0 4px}
  .flowswitch button{
    appearance:none; border:1px solid var(--line); background:var(--paper); color:var(--body);
    font-family:var(--f-mono); font-size:.78rem; padding:.5em .9em; border-radius:999px; cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  .flowswitch button:hover{border-color:var(--line-2); color:var(--ink)}
  .flowswitch button.on{background:var(--ink); border-color:var(--ink); color:#fff}

  /* ---------- flow doc head ---------- */
  .flowdoc{padding:18px 0 120px}
  .flowdoc__head{margin-bottom:1.6rem}
  .flowdoc__head .tags{display:flex; flex-wrap:wrap; gap:.5rem; margin-top:1rem}

  /* ---------- pipeline (horizontal nodes + arrows) ---------- */
  .flow{display:flex; align-items:stretch; gap:0; flex-wrap:wrap; margin-top:1.1rem}
  .flow .fnode{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:10px 14px; min-width:104px; position:relative; transition:border-color .2s, background .2s, box-shadow .2s;
  }
  .flow .fnode h5{margin:0; font-family:var(--f-mono); font-size:.8rem; font-weight:500; color:var(--cc,var(--ink)); display:flex; align-items:center; gap:.45em}
  .flow .fnode h5::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--cc,var(--accent)); transition:transform .2s}
  .flow .fnode p{margin:.2rem 0 0; font-size:.72rem; color:var(--mute); line-height:1.35}
  .flow .fnode.on{background:var(--paper); border-color:var(--cc); box-shadow:0 0 0 3px color-mix(in srgb, var(--cc) 16%, transparent)}
  .flow .fnode.on h5::before{transform:scale(1.5)}
  .flow .fnode.done{opacity:.65}
  .flow .farrow{align-self:center; padding:0 7px; font-family:var(--f-mono); font-size:.68rem; color:var(--mute); text-align:center; line-height:1.3}
  .flow .farrow::before{content:"→"; display:block; font-size:1.05rem; color:var(--line-2)}
  .flow .farrow.dash::before{content:"⇢"}

  /* ---------- numbered steps ---------- */
  .steps{list-style:none; counter-reset:step; margin:0; padding:0; display:grid; gap:10px}
  .steps li{
    counter-increment:step; display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:start;
    padding:13px 16px; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    cursor:pointer; transition:border-color .15s, background .15s, transform .15s;
  }
  .steps li::before{
    content:counter(step,decimal-leading-zero);
    font-family:var(--f-mono); font-weight:500; color:var(--mute);
    font-size:.92rem; padding-top:1px; transition:color .15s;
  }
  .steps li:hover{border-color:var(--line-2); background:var(--panel-2)}
  .steps li.on{background:var(--paper); border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .steps li.on::before{color:var(--accent); font-weight:600}
  .steps li.done{opacity:.7}
  .steps li.done::before{color:var(--accent)}
  .steps li.done::before{content:"✓"}
  .steps li b{font-weight:600; color:var(--ink); display:block; margin-bottom:.2rem}
  .steps li span{color:var(--body); font-size:.9rem; line-height:1.5}

  /* ---------- detail + code ---------- */
  .detail{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow)}
  .detail__actor{display:inline-flex; align-items:center; gap:.5em; font-family:var(--f-mono); font-size:.72rem; letter-spacing:.04em; color:var(--cc,var(--ink)); margin:0 0 .7rem}
  .detail__actor::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--cc,var(--accent))}
  .detail h4{font-family:var(--f-display); font-weight:600; font-size:1.12rem; margin:0 0 .5rem}
  .detail p{margin:0; color:var(--body); font-size:.94rem; line-height:1.55}

  .code{margin:0; background:var(--panel-2); border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .code__bar{display:flex; align-items:center; gap:.5em; padding:8px 12px; border-bottom:1px solid var(--line); font-family:var(--f-mono); font-size:.7rem; color:var(--mute); background:var(--paper)}
  .code__bar i{width:8px;height:8px;border-radius:2px;background:var(--cc,var(--accent))}
  .code__bar b{color:var(--ink); font-weight:500}
  .code pre{margin:0; padding:14px 16px; overflow-x:auto; font-family:var(--f-mono); font-size:.82rem; line-height:1.6; color:var(--ink); white-space:pre}
  .code .tok-com{color:var(--mute)}
  .code .tok-kw{color:var(--accent)}

  /* ---------- bottom nav ---------- */
  .navbar{position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:25;
          display:flex; align-items:center; gap:6px; background:var(--paper); border:1px solid var(--line);
          padding:5px; border-radius:999px; box-shadow:var(--shadow)}
  .navbar button{border:0; background:transparent; width:38px; height:34px; border-radius:999px; cursor:pointer; color:var(--body); font-family:var(--f-mono); font-size:.95rem; transition:background .15s, color .15s}
  .navbar button:hover:not(:disabled){background:var(--panel); color:var(--ink)}
  .navbar button:disabled{opacity:.35; cursor:default}
  .navbar .dots{display:flex; align-items:center; gap:5px; padding:0 8px}
  .navbar .dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2);transition:background .2s,transform .2s,width .2s;cursor:pointer;display:block}
  .navbar .dots i.on{background:var(--accent); transform:scale(1.3); width:18px; border-radius:4px}

  .counter{position:fixed; bottom:22px; right:clamp(20px,5vw,40px); z-index:20; font-family:var(--f-mono); font-size:.74rem; color:var(--mute)}
  .counter b{color:var(--ink); font-weight:600}
  .hint{position:fixed; bottom:22px; left:clamp(20px,5vw,40px); z-index:20; font-family:var(--f-mono); font-size:.7rem; color:var(--mute)}

  /* responsive */
  @media (max-width:880px){
    .grid-2{grid-template-columns:1fr}
    .hint{display:none}
    .flow .farrow{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar__inner">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">

        </g>

        <g fill="#d4d8e0"><circle cx="3" cy="20" r="1.3"/><circle cx="9" cy="20" r="1.3"/><circle cx="15" cy="20" r="1.3"/><circle cx="21" cy="20" r="1.3"/></g>
      </svg>
      <b>Privacy&nbsp;Cash</b> · action flows

</header>

<div class="wrap">
  <nav class="flowswitch" id="flowswitch" aria-label="Action flows"></nav>

  <main class="flowdoc" id="flow">
    <div class="flowdoc__head">
      <p class="eyebrow" id="f-eyebrow"></p>
      <h2 class="h2" id="f-title"></h2>
      <p class="lead" id="f-lead"></p>
      <div class="flow" id="f-pipeline" aria-label="Pipeline"></div>
    </div>

    <div class="grid-2">
      <ol class="steps" id="f-steps" aria-label="Steps"></ol>
      <div class="col">
        <div class="detail" id="f-detail">
          <p class="detail__actor" id="f-actor"></p>
          <h4 id="f-detail-title"></h4>
          <p id="f-summary"></p>
        </div>
        <div class="code" id="f-code">
          <div class="code__bar"><i id="f-code-dot"></i><span>snippet</span> · <b id="f-code-src"></b></div>
          <pre id="f-code-body"></pre>
        </div>
      </div>
    </div>
  </main>
</div>

<nav class="navbar" aria-label="Step navigation">
  <button id="prev" title="Previous (←)" aria-label="Previous">‹</button>
  <div class="dots" id="dots"></div>
  <button id="next" title="Next (→)" aria-label="Next">›</button>
</nav>
<div class="counter"><b id="cur">1</b> / <span id="tot">1</span></div>
<div class="hint">click a step · ← → navigate</div>

<script>
(function(){
  "use strict";

  // ---- role -> color var ----
  var ROLE = {
    program:"#111827", indexer:"#0e7c86", wallet:"#5b54e6",
    sdk:"#b45309", data:"#424a57", chain:"#6b7280", operator:"#7c3aed"
  };

  // ---- flows ----
  var FLOWS = {
    "deposit-sol": {
      label: "Deposit SOL",
      eyebrow: "Deposit · Transact  (ext_amount > 0)",
      title: "Deposit goes straight to the chain",
      lead: "Your wallet signs and sends it direct to the RPC — no relayer in the path. The pool escrows the SOL and inserts a commitment leaf.",
      stages: [
        {label:"pcash", sub:"note + proof", role:"sdk"},
        {label:"Wallet", sub:"sign tx", role:"wallet"},
        {label:"RPC", sub:"send raw", role:"chain"},
        {label:"Program", sub:"verify · leaf", role:"program"},
        {label:"Indexer", sub:"leaf → DB", role:"indexer"}
      ],
      steps: [
        {stage:"pcash", role:"sdk", actor:"Client SDK", title:"Unlock & derive key", summary:"The wallet signs the note-derive message; the SDK derives your shielded spending key locally.", src:"sdk/src/client.ts", code:"await client.unlock()\n// signer.signMessage(...) → spending key"},
        {stage:"pcash", role:"sdk", actor:"Client SDK", title:"Build the note & commitment", summary:"Generate a random blinding factor and compute the commitment Poseidon(amount, pubkey, blinding, mint). The output note is encrypted locally.", src:"sdk/src/client.ts", code:"note = makeNote({ amount, mint, ... })\ncommitment = poseidon([amount, pubkey, blinding, mint])"},
        {stage:"pcash", role:"sdk", actor:"Client SDK · WASM", title:"Prove (deposit)", summary:"Build a Groth16 proof with ext_amount > 0 — the sign that marks this as a deposit.", src:"sdk/src/client.ts", code:"proof = await groth16.prove({\n  ext_amount: +lamports,\n  root, inputs, outputs,\n})"},
        {stage:"Wallet", role:"wallet", actor:"Wallet · Phantom", title:"Sign the transaction", summary:"Build the Transact instruction and sign the versioned transaction.", src:"sdk/src/client.ts", code:"const tx = buildTransact(proof, extData)\nconst signed = await signer.signTransaction(tx)"},
        {stage:"RPC", role:"chain", actor:"Solana RPC", title:"Submit direct to RPC", summary:"The SDK submits the signed transaction straight to the RPC (no relayer) and waits for confirmation.", src:"sdk/src/client.ts", code:"const sig = await conn.sendRawTransaction(\n  signed.serialize(), { maxRetries: 5 }\n)"},
        {stage:"Program", role:"program", actor:"Program · Pinocchio", title:"Verify & insert leaf", summary:"Verify the proof, append the commitment as a new leaf in the height-26 tree, initialize the nullifier, and emit the leaf-index event.", src:"program", code:"verify_groth16(&proof, &pub)?;\nlet idx = tree.insert(commitment)?;\nemit!(LeafIndex { idx });"},
        {stage:"Indexer", role:"indexer", actor:"Backend indexer", title:"Index & save note", summary:"Decode the event; write the leaf + nullifier to Postgres. The client saves the encrypted note locally.", src:"backend/indexer", code:"indexer.record(leaf, nullifier)\nsaveNote(wallet, note)"}
      ]
    },

    "deposit-spl": {
      label: "Deposit SPL",
      eyebrow: "Deposit · TransactSpl  (ext_amount > 0)",
      title: "Deposit an SPL token straight to the chain",
      lead: "Same client-side path as SOL, but bound to a per-mint tree account (USDC, USDT, …) and SPL token transfers.",
      stages: [
        {label:"pcash", sub:"note + proof", role:"sdk"},
        {label:"Wallet", sub:"sign tx", role:"wallet"},
        {label:"RPC", sub:"send raw", role:"chain"},
        {label:"Program", sub:"verify · leaf", role:"program"},
        {label:"Indexer", sub:"leaf → DB", role:"indexer"}
      ],
      steps: [
        {stage:"pcash", role:"sdk", actor:"Client SDK", title:"Unlock & derive key", summary:"Wallet signs the note-derive message; the SDK derives the spending key.", src:"sdk/src/client.ts", code:"await client.unlock()"},
        {stage:"pcash", role:"sdk", actor:"Client SDK", title:"Build the note for this mint", summary:"Generate a blinding factor; compute the commitment including the mint; encrypt the output note locally.", src:"sdk/src/client.ts", code:"note = makeNote({ amount, mint, ... })\ncommitment = poseidon([amount, pubkey, blinding, mint])"},
        {stage:"pcash", role:"sdk", actor:"Client SDK · WASM", title:"Prove (deposit)", summary:"Groth16 proof with ext_amount > 0, scoped to the mint's tree.", src:"sdk/src/client.ts", code:"proof = await groth16.prove({\n  ext_amount: +amount, root, inputs, outputs,\n})"},
        {stage:"Wallet", role:"wallet", actor:"Wallet · Phantom", title:"Sign TransactSpl", summary:"Ensure vault + recipient ATAs, build the TransactSpl instruction, sign the versioned tx.", src:"sdk/src/client.ts", code:"const tx = buildTransactSpl(proof, extData, mint)\nconst signed = await signer.signTransaction(tx)"},
        {stage:"RPC", role:"chain", actor:"Solana RPC", title:"Submit direct to RPC", summary:"SDK submits the signed tx straight to the RPC (no relayer).", src:"sdk/src/client.ts", code:"sig = await conn.sendRawTransaction(signed.serialize())"},
        {stage:"Program", role:"program", actor:"Program · Pinocchio", title:"Verify & insert leaf", summary:"Verify the proof against the per-mint tree, insert the commitment leaf, init the nullifier.", src:"program", code:"verify_groth16(...)?;\ntree_for(mint).insert(commitment)?;"},
        {stage:"Indexer", role:"indexer", actor:"Backend indexer", title:"Index & save note", summary:"Record leaf + nullifier in Postgres; client saves the encrypted note.", src:"backend/indexer", code:"indexer.record(leaf, nullifier)\nsaveNote(wallet, note)"}

      steps: [
        {stage:"Client", role:"sdk", actor:"Client SDK", title:"Fetch the next leaf range", summary:"Page through encrypted leaves from the read-only backend, starting at the stored sync offset.", src:"sdk/src/client.ts", code:"const page = await api.utxoRange(treeKey, offset, offset + SIZE)"},
        {stage:"Backend", role:"indexer", actor:"Backend (read-only)", title:"Return encrypted outputs only", summary:"The backend returns ciphertext. It cannot tell which leaves belong to you — by design.", src:"backend", code:"GET /api/utxos/range?tree_key=..&start=..&end=.."},
        {stage:"Decrypt", role:"sdk", actor:"Client SDK", title:"Decrypt & keep owned notes", summary:"Decrypt each encrypted output with the derived key; keep the ones you own; advance the sync offset.", src:"sdk/src/client.ts", code:"for (const e of page) {\n  const n = decrypt(e, key)\n  if (owns(n)) saveNote(n)\n}\nsetSyncOffset(treeKey, page.end)"},
        {stage:"Decrypt", role:"sdk", actor:"Client SDK", title:"Mark spent notes", summary:"Notes whose nullifier is already on-chain are marked spent so they can't be selected for withdrawal.", src:"sdk/src/client.ts", code:"if (await api.nullifier(n.nullifier).spent)\n  markNoteSpent(n)"}
      ]
    },

    "admin": {
      label: "Admin",
      eyebrow: "Operator only · /api/relayer/* operator endpoints",
      title: "Operator setup & limits",
      lead: "These are operator actions that go through the backend's operator endpoints — distinct from user deposit/withdraw, which are client-signed and direct to RPC.",
      stages: [
        {label:"Operator", sub:"request", role:"operator"},
        {label:"Backend", sub:"build ix", role:"indexer"},
        {label:"Program", sub:"configure", role:"program"}
      ],
      steps: [
        {stage:"Operator", role:"operator", actor:"Operator", title:"Initialize the SOL pool", summary:"Boot the vault, the height-26 tree, and the global config.", src:"backend/routes/relayer.rs", code:"POST /api/relayer/initialize"},
        {stage:"Operator", role:"operator", actor:"Operator", title:"Initialize a per-mint tree", summary:"Create a dedicated tree account for an SPL mint (USDC, USDT, …).", src:"backend/routes/relayer.rs", code:"POST /api/relayer/initialize-spl\n{ mint }"},
        {stage:"Operator", role:"operator", actor:"Operator", title:"Update global config", summary:"Set the deposit, withdraw, and margin fee rates.", src:"backend/routes/relayer.rs", code:"POST /api/relayer/update-config\n{ deposit_fee, withdraw_fee, margin }"},
        {stage:"Operator", role:"operator", actor:"Operator", title:"Cap the SOL deposit limit", summary:"Set the maximum SOL deposit amount.", src:"backend/routes/relayer.rs", code:"POST /api/relayer/update-deposit-limit\n{ max_lamports }"},
        {stage:"Operator", role:"operator", actor:"Operator", title:"Cap a mint's deposit limit", summary:"Set the maximum deposit for a specific SPL mint.", src:"backend/routes/relayer.rs", code:"POST /api/relayer/update-deposit-limit-spl\n{ mint, max_amount }"}
      ]
    }
  };

  var ORDER = ["deposit-sol","deposit-spl","withdraw-sol","withdraw-spl","scan","admin"];

  // ---- DOM ----
  var switchEl = document.getElementById("flowswitch");
  var pipeEl   = document.getElementById("f-pipeline");
  var stepsEl  = document.getElementById("f-steps");
  var eyebrowEl= document.getElementById("f-eyebrow");
  var titleEl  = document.getElementById("f-title");
  var leadEl   = document.getElementById("f-lead");
  var actorEl  = document.getElementById("f-actor");
  var detailTit= document.getElementById("f-detail-title");
  var summaryEl= document.getElementById("f-summary");
  var codeSrc  = document.getElementById("f-code-src");
  var codeDot  = document.getElementById("f-code-dot");
  var codeBody = document.getElementById("f-code-body");
  var dotsEl   = document.getElementById("dots");
  var curEl    = document.getElementById("cur");
  var totEl    = document.getElementById("tot");
  var prevBtn  = document.getElementById("prev");
  var nextBtn  = document.getElementById("next");

  var flowId = ORDER[0];
  var stepIdx = 0;
  var dots = [];

  // build switcher
  ORDER.forEach(function(id){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = FLOWS[id].label;
    b.dataset.flow = id;
    b.addEventListener("click", function(){ setFlow(id); });
    switchEl.appendChild(b);
  });

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function highlight(code){
    // comment lines + a few keywords, kept intentionally simple
    return esc(code)
      .replace(/(^|\n)(\/\/[^\n]*)/g, '$1<span class="tok-com">$2</span>')
      .replace(/\b(await|const|let|for|of|if|return|new)\b/g, '<span class="tok-kw">$1</span>');
  }

  function setFlow(id){
    flowId = id; stepIdx = 0;
    Array.prototype.forEach.call(switchEl.children, function(b){
      b.classList.toggle("on", b.dataset.flow === id);
    });
    render();
  }

  function setStep(i){
    var n = FLOWS[flowId].steps.length;
    stepIdx = Math.max(0, Math.min(n - 1, i));
    render();
  }

  function render(){
    var f = FLOWS[flowId];
    var steps = f.steps;
    var active = steps[stepIdx];

    eyebrowEl.textContent = f.eyebrow;
    titleEl.textContent = f.title;
    leadEl.textContent = f.lead;

    // pipeline
    pipeEl.innerHTML = "";
    f.stages.forEach(function(st, i){
      var node = document.createElement("div");
      node.className = "fnode";
      node.style.setProperty("--cc", ROLE[st.role]);
      var on = (st.label === active.stage);
      if(on) node.classList.add("on");
      node.innerHTML = '<h5>' + esc(st.label) + '</h5><p>' + esc(st.sub) + '</p>';
      pipeEl.appendChild(node);
      if(i < f.stages.length - 1){
        var ar = document.createElement("div");
        ar.className = "farrow";
        pipeEl.appendChild(ar);
      }
    });

    // steps list
    stepsEl.innerHTML = "";
    steps.forEach(function(s, i){
      var li = document.createElement("li");
      if(i === stepIdx) li.classList.add("on");
      else if(i < stepIdx) li.classList.add("done");
      li.innerHTML = '<b>' + esc(s.title) + '</b><span>' + esc(s.summary) + '</span>';
      li.addEventListener("click", function(){ setStep(i); });
      stepsEl.appendChild(li);
    });

    // detail + code
    actorEl.textContent = s_actor(active);
    actorEl.style.setProperty("--cc", ROLE[active.role]);
    detailTit.textContent = active.title;
    summaryEl.textContent = active.summary;
    codeSrc.textContent = active.src;
    codeDot.style.background = ROLE[active.role];
    codeBody.innerHTML = highlight(active.code);

    // dots
    dotsEl.innerHTML = "";
    dots = [];
    steps.forEach(function(s, i){
      var d = document.createElement("i");
      d.setAttribute("role","button");
      d.setAttribute("tabindex","0");
      d.setAttribute("aria-label","Step " + (i+1));
      if(i === stepIdx) d.classList.add("on");
      d.addEventListener("click", function(){ setStep(i); });
      dotsEl.appendChild(d);
      dots.push(d);
    });

    curEl.textContent = (stepIdx + 1);
    totEl.textContent = steps.length;
    prevBtn.disabled = (stepIdx === 0 && flowId === ORDER[0]);
    nextBtn.disabled = (stepIdx === steps.length - 1 && flowId === ORDER[ORDER.length-1]);

    location.hash = flowId + (stepIdx > 0 ? ("-" + (stepIdx+1)) : "");
  }

  function s_actor(s){ return s.actor; }

  function next(){
    var f = FLOWS[flowId];
    if(stepIdx < f.steps.length - 1){ setStep(stepIdx + 1); }
    else { var i = ORDER.indexOf(flowId); if(i < ORDER.length - 1) setFlow(ORDER[i+1]); }
  }
  function prev(){
    if(stepIdx > 0){ setStep(stepIdx - 1); }
    else { var i = ORDER.indexOf(flowId); if(i > 0){ setFlow(ORDER[i-1]); var n = FLOWS[ORDER[i-1]].steps.length; stepIdx = n - 1; render(); } }
  }

  nextBtn.addEventListener("click", next);
  prevBtn.addEventListener("click", prev);

  document.addEventListener("keydown", function(e){
    var k = e.key;
    if(k === "ArrowRight" || k === "PageDown"){ e.preventDefault(); next(); }
    else if(k === "ArrowLeft" || k === "PageUp"){ e.preventDefault(); prev(); }
  });

  // deep link: #flowId  or  #flowId-n
  // (flow ids themselves contain hyphens, so match a known id by prefix, then parse the step tail)
  function applyHash(){
    var h = (location.hash || "").replace("#","");
    var matched = null, rest = "";
    for (var k = 0; k < ORDER.length; k++){
      var cid = ORDER[k];
      if (h === cid){ matched = cid; rest = ""; break; }
      if (h.indexOf(cid + "-") === 0){ matched = cid; rest = h.substring(cid.length + 1); break; }
    }
    if (matched){
      var n = rest ? parseInt(rest, 10) : NaN;
      flowId = matched;
      stepIdx = (!isNaN(n) && n >= 1) ? Math.min(n - 1, FLOWS[matched].steps.length - 1) : 0;
      Array.prototype.forEach.call(switchEl.children, function(b){ b.classList.toggle("on", b.dataset.flow === matched); });
      render();
    } else {
      setFlow(ORDER[0]);
    }
  }
  window.addEventListener("hashchange", applyHash);
  applyHash();
})();
</script>
</body>
</html>
