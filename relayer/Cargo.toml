[package]
name = "privacy-cash-relayer"
version = "0.1.0"
edition = "2021"
description = "Trust-minimized broadcaster and rent payer for Privacy Cash withdrawals, transfers and swaps"

[[bin]]
name = "privacy-cash-relayer"
path = "src/main.rs"

[dependencies]
# Runtime + HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Solana. Only the type and signing crates: RPC goes through `src/rpc.rs`, a small
# JSON-RPC client, so the relayer does not depend on the account-decoder and
# transaction-status stack for the six methods it actually calls.
solana-sdk = "=4.0.1"

# Outbound HTTP (JSON-RPC)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Hashing / encoding
sha2 = "0.10"
bs58 = "0.5"
hex = "0.4"
base64 = "0.22"
bincode = "1.3"

# Config / errors / logs
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
